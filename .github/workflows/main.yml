Entername: Unzip Files
on: [push]
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: |
          unzip -o *.zip
          rm *.zip
      - name: Save unpacked files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Unzip project files" || exit 0
          git push
