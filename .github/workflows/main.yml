name: Unzip Files
on:
  push:
  workflow_dispatch:
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: |
          for f in *.zip; do unzip -o "$f"; rm "$f"; done
          for d in */; do
            if [ "$d" != ".github/" ] && [ -f "${d}index.html" ]; then
              mv "$d"* . 2>/dev/null || true
              mv "$d".* . 2>/dev/null || true
              rmdir "$d" 2>/dev/null || true
            fi
          done
      - name: Save unpacked files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Unzip project files" || exit 0
          git push
